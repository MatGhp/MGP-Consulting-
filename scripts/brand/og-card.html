<!doctype html>
<!--
  Social preview card (public/og.png, 1200x630). Rendered by scripts/brand/render.mjs.
  Keep it free of dates such as the availability month: the image is cached by LinkedIn and others.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("../../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("../../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("../../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2") format("woff2"); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background-color: #020617;
    background-image: radial-gradient(rgba(148, 163, 184, 0.14) 1.5px, transparent 1.5px);
    background-size: 24px 24px;
    color: #fff;
    font-family: "Inter", sans-serif;
    padding: 72px 84px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .glow {
    position: absolute; top: -220px; right: -120px; width: 640px; height: 640px;
    border-radius: 50%; background: rgba(59, 130, 246, 0.16); filter: blur(90px);
  }
  .brand { position: relative; display: flex; align-items: center; gap: 20px; }
  .mark {
    width: 64px; height: 64px; border-radius: 14px; background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.12);
    display: flex; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 36px; color: #60a5fa;
  }
  .brand-name { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
  .brand-sub { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 18px; color: #cbd5e1; margin-top: 4px; }
  h1 {
    position: relative; font-size: 66px; line-height: 1.08; font-weight: 700; letter-spacing: -0.025em;
    max-width: 1000px;
  }
  h1 span { color: #60a5fa; }
  .facts { position: relative; display: flex; gap: 14px; }
  .fact {
    font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 18px; color: #cbd5e1; white-space: nowrap;
    border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(255, 255, 255, 0.04);
    border-radius: 999px; padding: 12px 20px;
  }
  .fact.site { color: #6ee7b7; border-color: rgba(52, 211, 153, 0.35); background: rgba(16, 185, 129, 0.08); }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="brand">
    <div class="mark">M</div>
    <div>
      <div class="brand-name">MGP Consulting</div>
      <div class="brand-sub">Mojtaba Ghanaat Pisheh · Freelance Senior .NET &amp; Azure Developer</div>
    </div>
  </div>

  <h1>Modernizing legacy .NET systems and Azure integrations <span>without risky rewrites.</span></h1>

  <div class="facts">
    <div class="fact">20+ years experience</div>
    <div class="fact">Frankfurt · Remote DE/EU</div>
    <div class="fact">DE &amp; EN (C1)</div>
    <div class="fact site">mgp-consulting.de</div>
  </div>
</body>
</html>
