<!doctype html>
<!--
  Template for the social preview card (public/og.png, 1200x630). Do not open it directly:
  scripts/brand/render.mjs fills the double-brace placeholders from src/i18n/translations/en.ts and
  public/favicon.svg, so the card always matches the site copy.
  Keep it free of dates such as the availability month: the image is cached by LinkedIn and others.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("{{fontBase}}/inter/files/inter-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("{{fontBase}}/inter/files/inter-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("{{fontBase}}/inter/files/inter-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("{{fontBase}}/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background-color: #020617;
    background-image: radial-gradient(rgba(148, 163, 184, 0.14) 1.5px, transparent 1.5px);
    background-size: 24px 24px;
    color: #fff;
    font-family: "Inter", sans-serif;
    padding: 72px 84px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .glow {
    position: absolute; top: -220px; right: -120px; width: 640px; height: 640px;
    border-radius: 50%; background: rgba(59, 130, 246, 0.16); filter: blur(90px);
  }
  .top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .mark svg { display: block; width: 64px; height: 64px; }
  .brand-name { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
  .brand-sub { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 18px; color: #cbd5e1; margin-top: 4px; }
  h1 {
    position: relative; font-size: 66px; line-height: 1.08; font-weight: 700; letter-spacing: -0.025em;
    max-width: 1000px;
  }
  h1 span { color: #60a5fa; }
  .facts { position: relative; display: flex; flex-wrap: wrap; gap: 14px; }
  .fact {
    font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 18px; color: #cbd5e1; white-space: nowrap;
    border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(255, 255, 255, 0.04);
    border-radius: 999px; padding: 12px 20px;
  }
  .fact.site { color: #6ee7b7; border-color: rgba(52, 211, 153, 0.35); background: rgba(16, 185, 129, 0.08); }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="top">
    <div class="brand">
      <div class="mark">{{mark}}</div>
      <div>
        <div class="brand-name">{{companyName}}</div>
        <div class="brand-sub">{{name}} · {{role}}</div>
      </div>
    </div>
    <div class="fact site">mgp-consulting.de</div>
  </div>

  <h1>{{headline}} <span>{{headlineAccent}}</span></h1>

  <div class="facts">
    {{facts}}
  </div>
</body>
</html>
